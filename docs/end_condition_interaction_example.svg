<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#2563ad"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 22px Arial, sans-serif; fill: #334155; }
      .action { fill: #dbeafe; stroke: #2563ad; stroke-width: 3; }
      .fact { fill: #dcfce7; stroke: #15803d; stroke-width: 3; }
      .node { font: 700 28px Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 500 18px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .edge { stroke: #1f2937; stroke-width: 4; marker-end: url(#arrow); }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .panel-title { font: 700 23px Arial, sans-serif; fill: #1e3a5f; }
      .formula { font: 500 23px Arial, sans-serif; fill: #111827; }
    </style>
  </defs>

  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="750" y="52" class="title" text-anchor="middle">End-Condition Interaction Example</text>
  <text x="750" y="91" class="subtitle" text-anchor="middle">One ordinary directed graph: arrows represent causal influence</text>

  <!-- Directed interaction graph -->
  <rect x="55" y="125" width="1390" height="285" rx="18" class="panel"/>
  <text x="85" y="164" class="panel-title">Interaction graph</text>

  <rect x="110" y="225" width="190" height="90" rx="14" class="action"/>
  <text x="205" y="270" class="node">a2</text>
  <text x="205" y="345" class="small">produces f2</text>

  <circle cx="470" cy="270" r="58" class="fact"/>
  <text x="470" y="271" class="node">f2</text>

  <rect x="650" y="225" width="190" height="90" rx="14" class="action"/>
  <text x="745" y="270" class="node">a3</text>
  <text x="745" y="345" class="small">requires f2; produces f1</text>

  <circle cx="1015" cy="270" r="58" class="fact"/>
  <text x="1015" y="271" class="node">f1</text>

  <rect x="1195" y="225" width="190" height="90" rx="14" class="action"/>
  <text x="1290" y="270" class="node">a1</text>
  <text x="1290" y="345" class="small">end condition: f1</text>

  <line x1="300" y1="270" x2="412" y2="270" class="edge"/>
  <line x1="528" y1="270" x2="650" y2="270" class="edge"/>
  <line x1="840" y1="270" x2="957" y2="270" class="edge"/>
  <line x1="1073" y1="270" x2="1195" y2="270" class="edge"/>

  <!-- STN interpretation -->
  <rect x="55" y="440" width="1390" height="270" rx="18" class="panel"/>
  <text x="85" y="480" class="panel-title">Temporal constraints derived after choosing these action occurrences</text>

  <text x="115" y="535" class="formula">E(a2) ≤ S(a3)</text>
  <text x="410" y="535" class="subtitle">f2 must be available before a3 starts</text>

  <text x="115" y="585" class="formula">E(a3) ≤ E(a1)</text>
  <text x="410" y="585" class="subtitle">f1 must exist when the end condition of a1 is checked</text>

  <text x="115" y="650" class="formula">Latest aligned start:</text>
  <text x="375" y="650" class="formula">S(a3) = S(a1) + d(a1) − d(a3)</text>
  <line x1="885" y1="643" x2="1020" y2="643" stroke="#2563ad" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="1210" y="650" class="subtitle" text-anchor="middle">E(a3) just before E(a1)</text>
  <text x="750" y="690" class="small">ε-limit semantics: E(a3) ≺ CheckEnd(a1), even when both use the same stored boundary time.</text>
</svg>
